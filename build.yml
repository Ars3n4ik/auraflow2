name: Build AuraFlow Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
        # Создаём папку для SDK
        mkdir -p $HOME/theos/sdks
        
        # Распаковываем SDK из tar.xz
        cd $HOME/theos/sdks
        tar -xf $GITHUB_WORKSPACE/iPhoneOS15.6.sdk.tar.xz

    - name: Compile ldid
      run: |
        # Компилируем ldid из исходников
        cd $GITHUB_WORKSPACE/ldid
        clang++ -std=c++11 -o ldid ldid.cpp -I. -framework Security
        
        # Копируем в системную папку
        sudo cp ldid /usr/local/bin/
        sudo chmod +x /usr/local/bin/ldid
        
        # Проверяем
        /usr/local/bin/ldid --version || echo "ldid compiled successfully"

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export SDKVERSION=15.6
        export SYSROOT=$HOME/theos/sdks/iPhoneOS15.6.sdk
        export TARGET=iphone:clang:15.6:15.6
        export ARCHS="arm64 arm64e"
        export PATH=/usr/local/bin:$PATH
        make clean
        make package

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraFlow.deb
        path: packages/*.deb
