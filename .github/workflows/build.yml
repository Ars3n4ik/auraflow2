# .github/workflows/build.yml
name: Build AuraFlow Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        # Скачиваем и распаковываем SDK для iOS 15.6
        mkdir -p $HOME/theos/sdks
        cd $HOME/theos/sdks
        wget https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS15.6.sdk.zip
        unzip -q iPhoneOS15.6.sdk.zip
        rm iPhoneOS15.6.sdk.zip

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export SDKVERSION=15.6
        make clean
        make package

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraFlow.deb
        path: packages/*.deb
